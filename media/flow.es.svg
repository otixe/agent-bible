<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 170" role="img" aria-labelledby="dt dd">
<title id="dt">De un agente en blanco a uno confirmado</title><desc id="dd">Cuatro pasos: copiar la carta, pegarla en tu plataforma, responder las preguntas del primer arranque y confirmar la identidad que el agente escribe.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#65d8ba"/></marker></defs>
<rect width="1100" height="170" rx="16" fill="#102127"/>
<rect x="30.0" y="40" width="227.0" height="110" rx="14" fill="#182e34" stroke="#65d8ba" stroke-opacity=".8"/><rect x="30.0" y="40" width="6" height="110" rx="3" fill="#65d8ba"/><text x="52.0" y="82" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="19" font-weight="700" fill="#e4fff4">1 · Copiá</text><text x="52.0" y="106" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="13.5" fill="#b9d2d5">la carta de carta/</text><path d="M 263.0 95 L 295.0 95" stroke="#65d8ba" stroke-width="2.2" marker-end="url(#ar)"/><rect x="301.0" y="40" width="227.0" height="110" rx="14" fill="#182e34" stroke="#7cc4ff" stroke-opacity=".8"/><rect x="301.0" y="40" width="6" height="110" rx="3" fill="#7cc4ff"/><text x="323.0" y="82" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="19" font-weight="700" fill="#e4fff4">2 · Pegá</text><text x="323.0" y="106" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="13.5" fill="#b9d2d5">en tu plataforma</text><path d="M 534.0 95 L 566.0 95" stroke="#65d8ba" stroke-width="2.2" marker-end="url(#ar)"/><rect x="572.0" y="40" width="227.0" height="110" rx="14" fill="#182e34" stroke="#f2b84b" stroke-opacity=".8"/><rect x="572.0" y="40" width="6" height="110" rx="3" fill="#f2b84b"/><text x="594.0" y="82" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="19" font-weight="700" fill="#e4fff4">3 · Pregunta</text><text x="594.0" y="106" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="13.5" fill="#b9d2d5">quién es · quién sos</text><path d="M 805.0 95 L 837.0 95" stroke="#65d8ba" stroke-width="2.2" marker-end="url(#ar)"/><rect x="843.0" y="40" width="227.0" height="110" rx="14" fill="#182e34" stroke="#65d8ba" stroke-opacity=".8"/><rect x="843.0" y="40" width="6" height="110" rx="3" fill="#65d8ba"/><text x="865.0" y="82" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="19" font-weight="700" fill="#e4fff4">4 · Confirmás</text><text x="865.0" y="106" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="13.5" fill="#b9d2d5">su SOUL, y recién trabaja</text></svg>