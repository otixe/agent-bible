<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 170" role="img" aria-labelledby="dt dd">
<title id="dt">From a blank agent to a confirmed one</title><desc id="dd">Four steps: copy the letter, paste it into your platform, answer the agent&#x27;s first-boot questions, confirm the identity it writes.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#65d8ba"/></marker></defs>
<rect width="1100" height="170" rx="16" fill="#102127"/>
<rect x="30.0" y="40" width="227.0" height="110" rx="14" fill="#182e34" stroke="#65d8ba" stroke-opacity=".8"/><rect x="30.0" y="40" width="6" height="110" rx="3" fill="#65d8ba"/><text x="52.0" y="82" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="19" font-weight="700" fill="#e4fff4">1 · Copy</text><text x="52.0" y="106" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="13.5" fill="#b9d2d5">the letter from carta/</text><path d="M 263.0 95 L 295.0 95" stroke="#65d8ba" stroke-width="2.2" marker-end="url(#ar)"/><rect x="301.0" y="40" width="227.0" height="110" rx="14" fill="#182e34" stroke="#7cc4ff" stroke-opacity=".8"/><rect x="301.0" y="40" width="6" height="110" rx="3" fill="#7cc4ff"/><text x="323.0" y="82" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="19" font-weight="700" fill="#e4fff4">2 · Paste</text><text x="323.0" y="106" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="13.5" fill="#b9d2d5">into your platform</text><path d="M 534.0 95 L 566.0 95" stroke="#65d8ba" stroke-width="2.2" marker-end="url(#ar)"/><rect x="572.0" y="40" width="227.0" height="110" rx="14" fill="#182e34" stroke="#f2b84b" stroke-opacity=".8"/><rect x="572.0" y="40" width="6" height="110" rx="3" fill="#f2b84b"/><text x="594.0" y="82" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="19" font-weight="700" fill="#e4fff4">3 · It asks</text><text x="594.0" y="106" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="13.5" fill="#b9d2d5">who it is · who you are</text><path d="M 805.0 95 L 837.0 95" stroke="#65d8ba" stroke-width="2.2" marker-end="url(#ar)"/><rect x="843.0" y="40" width="227.0" height="110" rx="14" fill="#182e34" stroke="#65d8ba" stroke-opacity=".8"/><rect x="843.0" y="40" width="6" height="110" rx="3" fill="#65d8ba"/><text x="865.0" y="82" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="19" font-weight="700" fill="#e4fff4">4 · You confirm</text><text x="865.0" y="106" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="13.5" fill="#b9d2d5">its SOUL, then it works</text></svg>